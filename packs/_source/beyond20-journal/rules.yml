  - name: Barbarian
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Critical Hits</h2>
        <p>At level 22, critical hits land on a roll of 19 - 20. Additionally, at level 26, critical hits land on a roll of 18 - 20. Starting at level 50 you ALWAYS crit.</p>
        <h2>Strength and Constitution Score Increases</h2>
        <p>Starting at level 32 and every 4th level onward, the maximum for your Strength and Constitution score increases by 2, and both scores are increased by 2.</p>
        <h2>Additional Rage Damage</h2>
        <p>Your rage damage increases to +5 at level 27, +6 at level 34, +7 at level 41, and +8 at level 48.</p>
      markdown: ""
