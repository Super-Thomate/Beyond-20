  - name: Bard
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>At level 21, you gan an additional spell. You gain one more spell every 2nd level (level 23, 25, 27 etc.).
        You also gain additional cantrips at level 21 (5) and level 45 (6).</p>
        <h2>Magical Secrets</h2>
        <p>At level 26, you can learn four spells from any class. You can learn an additional four spells from any class at level 40.</p>
        <h2>Charisma Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Charisma scores increase by 2, and your Charisma score also increases by 2.</p>
        <h2>Bardic Inspiration Improvement</h2>
        <p>At level 30, a creature who uses your bardic inspiration dice gains advantage on the rolls. Bardic inspiration increases to 1d20 at level 22, 2d12 at level 30, 2d20 at level 38, 3d12 at level 46, and 3d20 at level 50.</p>
      markdown: ""
    _id: I8A1zPgpICyghtAf
