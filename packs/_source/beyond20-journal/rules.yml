  - name: Cleric
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>You gain additional cantrips at level 21 (6) and level 45 (7).</p>
        <h2>Extra Divinity Points</h2>
        <p>At level 22, you gain an extra divinity point to use per day, again another extra divinity point at level 30, a third extra point at 38, and a 4th extra at level 46.</p>
        <h2>Divine Intervention Increase</h2>
        <p>At level 26, after a long rest, roll 1d4 to determine the amount of divine interventions granted for the next 7 days.</p>
        <h2>Wisdom Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Wisdom scores increase by 2, and your Wisdom score also increases by 2.</p>
        <h2>Additional Domain</h2>
        <p>At level 30, select a domain other than the one you started with. You gain access to the spells granted by that domain. Choose a spell from each line of the domain's spell table.</p>
        <h2>Holy Power Feature</h2>
        <p>At level 50 your deity bestows upon you the strength of a permanent holy aura spell requiring no concentration or spell slot from you. Additionally, when an affected creature succeeds on a saving throw made against a spell or magical effect that allows it to make a saving throw to take only half damage, it instead takes no damage if it succeeds on the saving throws. Also any creature of your choice within the aura regenerates 10 HP when starting their turn and any fiend or undead blinded by the aura is blinded for 5 turns otherwise the spell works the same. You also get to cast Greater Restoration (as if cast as a level 9 spell)at will and Mass Heal or True Resurrection or Power Word:Heal once per long rest requiring no spell slot.</p>
      markdown: ""
    _id: nEOWPFErVN6TMODC
    sort: 600000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.nEOWPFErVN6TMODC"
  - name: Druid
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>You gain additional cantrips at level 21 (5) and level 45 (6).</p>
        <h2>Plant and Beast Communication Improvement</h2>
        <p>At level 22, you can always communicate with beasts and plants. At level 30, all beasts and plants regard you as a god, either willingly serving or at the least, refusing to attack you.</p>
        <h2>Wild Shape Improvement</h2>
        <p>At level 26, the max CR of your wild shape increases by 1 (land = CR 2, moon = CR 9), it increases by 1 again every 3 levels. level 29: (land = CR 3, moon = CR 13), again at level 32 (land = CR 4, moon = CR 15), ect. Starting at level 50 the max CR of your wild shape becomes 30.</p>
        <h2>Wisdom Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Wisdom scores increase by 2, and your Wisdom score also increases by 2.</p>
      markdown: ""
    _id: CRcCECUMy4kwBzBt
    sort: 700000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.CRcCECUMy4kwBzBt"
  - name: Fighter
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Indomitable and Second Wind Charges</h2>
        <p>At level 22, you gain an additional charge of indomitable (4) and second wind. At level 32, you gain an additional charge of action surge (3) and second wind (3). At level 47, you gain an additional charge of action surge (4).</p>
        <h2>Strength and Dexterity Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Strength and Dexterity scores increase by 2, and each increases by 2.</p>
        <h2>Additional Extra Attacks</h2>
        <p>At level 30, you gain an additional extra attack (4). At level 40, you gain an additional extra attack (5). At level 50, you gain an additional extra attack (6).</p>
        <h2>Damage Immunities and Resistances</h2>
        <p>At 38th level, you gain resistance to bludgeoning, piercing, and slashing damage.</p>
        <p>At 42nd level, you gain resistance to 3 of the following damage types, your choice: acid, cold, fire, lightning, thunder.</p>
        <p>At 46th level, you gain resistance to 3 of the following damage types, your choice: force, necrotic, poison, psychic or radiant.</p>
        <p>At 50th level: Choose one of the damage types you chose at 42nd and 46th levels. Your resistance becomes immunity for those 2 damage types.</p>
      markdown: ""
    _id: 93ow6rkeQ64mQFgW
    sort: 800000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.93ow6rkeQ64mQFgW"
  - name: Monk
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Martial Arts and Ki Point Increase</h2>
        <p>At level 21, your martial arts die increases to 1d12, then 2d8 at level 29, 3d6 at level 33, 2d10 at level 37, and 2d12 at level 45. Additionally at level 21, your maximum number of ki points is 21, and increase by 1 per monk level.</p>
        <h2>Perfect Self and Empty Body Improvement</h2>
        <p>At level 22, the effects of perfect self and empty body are doubled (the number of Ki points required isn't doubled). Additionally at level 46, the effects of perfect self and empty body are quadrupled (the number of Ki points required is doubled).</p>
        <h2>Movement Speed Increase</h2>
        <p>At level 24, Movement speed increases to 35 feet, and you can walk and stand on walls, ceilings, and liquid without falling. Your movement speed increases by an additional 5 feet every 4th level (level 28, 32 etc).</p>
        <p>Additionally at level 42, jumping distance is doubled, you can dash using a bonus action, and your unarmed attacks reach increases by 5 feet.</p>
        <h2>Dexterity and Wisdom Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Dexterity and Wisdom scores increase by 2, and each increases by 2.</p>
        <h2>Ki Point Improvement</h2>
        <p>At level 30, whenever you use an action that requires spending ki points, roll 1d4. If the result is a 3 or a 4, cut the ki cost of that action in half, rounding up. Additionally, at level 50 You have no max ki points and when recovering all ki from sleep you get ki = your old max multiplied by 2.</p>
      markdown: ""
    _id: cbudFX2CexYrw9c8
    sort: 900000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.cbudFX2CexYrw9c8"
  - name: Paladin
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spell Slots</h2>
        <p>
          <ul>
            <li>Level 22 - 1 2nd level spell slot.</li>
            <li>Level 30 - 1 3rd level spell slot.</li>
            <li>Level 34 - 1 4th level spell slot.</li>
            <li>Level 42 - 1 5th level spell slot.</li>
            <li>Level 50 - 1 5th level spell slot.</li>
          </ul>
        </p>
        <h2>Aura of Protection Improvement</h2>
        <p>At level 22, the range of your auras of protection and courage increase to 100 feet.</p>
        <h2>Healing Aura Feature</h2>
        <p>At level 30, all friendly creatures within 50 feet of you and you are healed a number of hit points at the start of their turn equal to your Charisma modifier (minimum 1). This also works on downed and unconscious allies.</p>
        <h2>Charisma Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Charisma scores increase by 2, and your Charisma score also increases by 2.</p>
        <h2>Sacred Oath Improvement</h2>
        <p><You can channel divinity up to three times before having to rest at level 30, and four times at level 40./p>
        <h2>Improved Divine Smite Improvement</h2>
        <p>The damage of your improved divine smite feature Increases by 2d8 at 21st level, and every 5 levels after that. (5d8 at 26th, 7d8 at 31st, 9d8 at 36th, 11d8 at 41st, and 12d8 at 46th.)</p>
        <h2>Improved Extra Attack</h2>
        <p>At level 46, you gain an additional attack per attack action.</p>
        <h2>Holy Power Feature</h2>
        <p>At level 50 your Oath bestows upon you the strength of a permanent holy aura spell requiring no concentration or spell slot from you. Additionally, when an affected creature succeeds on a saving throw made against a spell or effect that allows it to make a saving throw to take only half damage, it instead takes no damage if it succeeds on the saving throws. Also any enemy creature that starts its turn in this area or enters it takes 10 radiant damage and any fiend or undead blinded by the aura is blinded for 5 turns otherwise the spell works the same. You also get to cast Greater Restoration (as if cast as a level 9 spell) at will and Mass Heal or True Resurrection or Power Word:Heal once per long rest requiring no spell slot.</p>
      markdown: ""
    _id: 4poePjLRDo8TAtco
    sort: 1000000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.4poePjLRDo8TAtco"
  - name: Ranger
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>At level 21, you gain an additional spell. You gain one more spell every 2nd level (level 23, 25, 27 etc.).</p>
        <h2>Feral Senses Increase</h2>
        <p>At level 22, feral senses increase to 60 feet. At level 35, feral senses increases to 100 feet.</p>
        <h2>Hide in Plain Sight Improvement</h2>
        <p>At level 26, while camouflaged, you can move at half speed and remain camouflaged. At level 34, you can camouflage yourself using your whole turn (6 seconds) instead of 1 minute. At level 38, you can take either an action or a bonus action and stay camouflaged, but not both.</p>
        <h2>Dexterity Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Dexterity scores increase by 2, and your Dexterity score also increases by 2.</p>
        <h2>Favored Enemy or Natural Explorer Improvement</h2>
        <p>At level 30, choose either favored enemy or natural explorer. If you chose favored enemy, all known types of monsters (except for humanoids) are treated as favored enemies. If you chose natural explorer, all terrain types are treated as favored terrain. You gain the other choice at level 42.</p>
        <h2>Critical Strike</h2>
        <p>At level 30, if you havent attacked yet this turn, you can focus on a single attack, and sacrifice your extra attack to choose to turn your attack into a critical hit once per long rest. At level 50 all your attacks become criticals, without any sacrifice necessary.</p>
      markdown: ""
    _id: sqYttv5juTbPryt7
    sort: 1100000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.sqYttv5juTbPryt7"
  - name: Rogue
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Blindsense Increase</h2>
        <p>Your blindsense increases to 20 feet at level 22, 30 feet at level 30, 40 feet at level 35, 50 feet at level 40, and 60 feet at level 50.</p>
        <h2>Sneak Attack Increase</h2>
        <p>Your sneak attack die increases to 6d12 at level 23. It then increases by an additional d12 every 4th level (7d12 at level 27, 8d12 at level 31 etc.).</p>
        <h2>Dexterity Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Dexterity scores increase by 2, and your Dexterity score also increases by 2.</p>
        <h2>Stroke of Luck Improvement</h2>
        <p>You can use Stroke of luck twice per short or long rest at level 26, and three times a per short or long rest at level 40.At level 30, if you use the stroke of luck to turn a missed attack roll into a hit, you can treat it as a Sneak Attack. </p>
        <h2>Additional Expertise</h2>
        <p>At level 34 you can chose and additional 2 skills you have proficiency in or one skill and your proficiency in thieves tools and double your proficiency modifier, If you do not have any skills without expertise gain proficiency in a skill of your choice You gain another additional expertise at level 44</p>
        <h2>Assasination Feature</h2>
        <p>At level 50 you may cast Power Word Kill twice per Long Rest requiring no spell slot and needing no components. It just happens.</p>
      markdown: ""
    _id: U7gkLggM7zLOHKyd
    sort: 1200000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.U7gkLggM7zLOHKyd"
  - name: Sorcerer
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>At level 21, you gain an additional spell. You gain one more spell every 2nd level (level 23, 25, 27 etc.). You also gain additional cantrips at level 21 (7) and level 45 (8).</p>
        <h2>Sorcery Point Improvement</h2>
        <p>At level 21, your maximum amount of sorcery points is equal to your sorcerer level.</p>
        <p>At level 26, when you roll for initiative, you regain half expended sorcery points (rounded up).</p>
        <h2>Charisma Score Improvements:</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Charisma scores increase by 2, and your Charisma score also increases by 2.</p>
        <h2>Sorcery Point Spell Slot Improvement:</h2>
        <p>Additionally at level 21, you can now create 1st level spell slots for 2 points, 2nd level for 3 points, 3rd level for 4 points, 4th level for 5 points, 5th level for 6 points, 6th level for 7 points, 7th level for 8 points, 8th level for 9 points, and 9th level for 10 points.</p>
        <p>At level 50 you may now convert spell slots of lower level into higher ones. Example: converting two level one spell slots into one level 2 spell slot, the spell slots don't have to be of the same level and can work down or up, you can also convert something like a sixth level spell slot and a third level spell slot to a ninth level spell slot, or convert a ninth level spell slot into a sixth and a third, or a seventh and second, ect.</p>
      markdown: ""
    _id: 0gFj1OanMNOqxNop
    sort: 1300000
    _key: "!journal.pages!K0SZivTDzqnRvJq0.0gFj1OanMNOqxNop"
  - name: Warlock
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots:</h2>
        <p>At level 21, you gain an additional spell. You gain one more spell every 2nd level (level 23, 25, 27 etc.).</p>
        <p>You also gain additional cantrips at level 21 (7) and level 45 (8).</p>
        <p>You also gain additional Spell Slot at level 21 (5), 31 (6), 41 (7) and level 50 (8).</p>
        <p>You also gain an additional level of spell slots at level 21 (6th), level 31(7th), and level 41(8th)</p>
        <h2>Eldritch Invocation Increase</h2>
        <p>At level 21, the number of eldritch invocation you can know is increased by 4. This increases to 6 at level 30, 8 at level 40, and 10 at level 50. </p>
        <h2>Charisma Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Charisma scores increase by 2, and your Charisma score also increases by 2.</p>
        <h2>Eldritch Master Increase</h2>
        <p>At level 26, you can use eldritch master twice between long rests.</p>
        <p>At level 30, when you use eldritch master, you also regain spells that you have cast through mystic arcanum.</p>
        <h2>Mystic Arcanum Increase</h2>
        <p>At level 40, double the amount of arcanum known at each spell level.</p>
