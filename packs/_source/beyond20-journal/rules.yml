      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>You gain additional cantrips at level 21 (7) and level 45 (8).</p>
        <h2>Signature Spell Improvement</h2>
        <p> At level 22, when you cast a signature spell, you can choose one of the following effects to add to it:
          <ul>
            <li>Halve the range, area of effect, or spell duration, and double the number of dice used and bonuses added.</li>
            <li>Double the range, area of effect (if the spell has one), or spell duration, and halve the number of dice used and bonuses added(rounded up).</li>
            <li>Your spell save DC = 8 + double your proficiency bonus + your spell attack bonus, and halve the dice used and bonuses added.</li>
            <li>Your spell save DC = 8 + your spellcasting modifier, and double the dice used and bonuses added.</li>
          </ul>
        </p>
        <h2>Arcane Tradition Increase</h2>
        <p>At level 30, select a second arcane tradition, gaining all the benefits therein.</p>
        <h2>Spell Mastery Increase</h2>
        <p>At level 36, you gain mastery over one 3rd and 4th level spell.</p>
        <h2>Intelligence Score Improvements</h2>
        <p>Starting at level 26 and each 4th level onward, your maximum for your Intelligence scores increase by 2, and your Intelligence score also increases by 2.</p>
        <h2>Arcane Recovery Improvement</h2>
        <p>Starting at level 40 you can also recover spells up to eighth level, instead of up to sixth. This increases to level 9 at level 50.</p>
      markdown: ""
