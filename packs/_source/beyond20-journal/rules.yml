  - name: Artificer
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2>Additional Spells and Spell Slots</h2>
        <p>You also gain additional cantrips at level 24 (5), level 28 (6), level 38 (7), and level 42 (8).</p>
        <h2>Infusion and Infused Item Improvement</h2>
        <p>You get another known infusion at level 23, 27, 31, 35, 39, 43, and 47</p>
        <p>You get another infused item at level 21, 26, 31, 36, 41, and 46.</p>
        <h2>Spell Storing Item Improvement</h2>
        <p>Your spell-storing item feature can use level three, four, and five spells at level 26, and the feature can be used on any equipment.</p>
        <p>At level 30 you can use your spell-storing item feature a number of times equal to half your Intelligence score (rounded up).</p>
        <p>At level 50 you can use your spell-storing item feature an infinite number of times.</p>
        <h2>Intelligence Score Improvements</h2>
        Starting at level 26 and each 4th level onward, your maximum for your Intelligence scores increase by 2, and your Intelligence score also increases by 2.
        <h2>Flash of Genius Improvement</h2>
        At level 30 whenever you use the Flash of Genius feature you double your intelligence modifier. This changes to triple at level 50.
      markdown: ""
